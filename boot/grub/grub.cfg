set timeout=5
set default=0

# Carica i moduli video necessari
insmod all_video
insmod gfxterm
insmod jpeg

# Imposta la risoluzione grafica (supportata da GRUB)
set gfxmode=1920x1080
set gfxpayload=keep

# Imposta il tema e l'immagine di sfondo
terminal_output gfxterm
background_image /boot/grub/splash.jpg

# Menu di avvio
menuentry "GAB OS" {
    # Specifica il kernel Linux estratto
    linux /gab-os-kernel root=/dev/sda1 splash plymouth.enable=1
    # Se avrai un initramfs, aggiungilo qui:
    # initrd /gab-os-initramfs
}

# Opzioni di recupero
menuentry "GAB OS (Recovery Mode)" {
    linux /gab-os-kernel root=/dev/sda1 single
}
