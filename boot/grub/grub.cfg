set timeout=5
set default=0

# Configurazione grafica di base per GRUB
set gfxmode=auto
set gfxpayload=keep

menuentry "GAB OS" {
    search --no-floppy --fs-uuid --set=root @GAB_UUID@
    linux /boot/vmlinuz root=/dev/sr0 ro quiet splash
    initrd /boot/initrd.img
}

menuentry "GAB OS (Recovery Mode)" {
    linux /boot/vmlinuz root=/dev/sr0 ro single
}
